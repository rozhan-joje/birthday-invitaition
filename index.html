<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#dbe7f6">
  <title>دعوت‌نامه ✦ You have been invited</title>
  <meta name="description" content="یک دعوت‌نامهٔ ویژه، فقط برای تو.">

  <!-- Link preview (Telegram / WhatsApp): after deploying, replace with your ABSOLUTE url -->
  <meta property="og:title" content="You have been invited ✦">
  <meta property="og:description" content="یک دعوت‌نامهٔ ویژه، فقط برای تو.">
  <meta property="og:image" content="assets/images/card.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500;1,600&family=Vazirmatn:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="assets/images/card.jpg">
  <link rel="stylesheet" href="tailwind.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Shared ornament (gold fleuron, taken from the card's frame) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="fleuron" viewBox="0 0 120 26">
      <path d="M60 2c4 6 4 12 0 18-4-6-4-12 0-18z" fill="currentColor"/>
      <path d="M55 15c-8 8-19 8-27 2-6-5-4-11 2-10 5 1 5 7 1 8M65 15c8 8 19 8 27 2 6-5 4-11-2-10-5 1-5 7-1 8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M4 14h20M96 14h20" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
    </symbol>
  </svg>

  <noscript><p style="padding:2rem;text-align:center">برای دیدن این دعوت‌نامه، JavaScript را فعال کن.</p></noscript>

  <div class="bg" aria-hidden="true"></div>
  <div class="bg-veil" aria-hidden="true"></div>

  <button class="sound-btn" id="soundBtn" type="button" aria-label="روشن یا خاموش کردن صدا" aria-pressed="false" data-nosound></button>

  <!-- ============ MAIN FRAME (scenes 0–7) ============ -->
  <main class="frame" id="frame">
    <div class="candles pointer-events-none absolute inset-0 z-0 overflow-hidden" aria-hidden="true"><i class="candle absolute w-[11px] h-[34px] rounded-[3px] bg-gradient-to-b from-white to-[#efe4c6] animate-bob" style="left:9%;top:13%;animation-delay:0s;animation-duration:6s"><b class="flame absolute -top-[15px] left-1/2 -ml-[4px] w-[8px] h-[15px] rounded-[50%_50%_50%_50%/60%_60%_40%_40%] bg-gradient-to-b from-white via-butter to-gold animate-flicker"></b></i><i class="candle absolute w-[11px] h-[34px] rounded-[3px] bg-gradient-to-b from-white to-[#efe4c6] animate-bob" style="left:24%;top:8%;animation-delay:1.2s;animation-duration:7s"><b class="flame absolute -top-[15px] left-1/2 -ml-[4px] w-[8px] h-[15px] rounded-[50%_50%_50%_50%/60%_60%_40%_40%] bg-gradient-to-b from-white via-butter to-gold animate-flicker"></b></i><i class="candle absolute w-[11px] h-[34px] rounded-[3px] bg-gradient-to-b from-white to-[#efe4c6] animate-bob" style="left:44%;top:5%;animation-delay:0.6s;animation-duration:5.5s"><b class="flame absolute -top-[15px] left-1/2 -ml-[4px] w-[8px] h-[15px] rounded-[50%_50%_50%_50%/60%_60%_40%_40%] bg-gradient-to-b from-white via-butter to-gold animate-flicker"></b></i><i class="candle absolute w-[11px] h-[34px] rounded-[3px] bg-gradient-to-b from-white to-[#efe4c6] animate-bob" style="left:64%;top:9%;animation-delay:2s;animation-duration:6.5s"><b class="flame absolute -top-[15px] left-1/2 -ml-[4px] w-[8px] h-[15px] rounded-[50%_50%_50%_50%/60%_60%_40%_40%] bg-gradient-to-b from-white via-butter to-gold animate-flicker"></b></i><i class="candle absolute w-[11px] h-[34px] rounded-[3px] bg-gradient-to-b from-white to-[#efe4c6] animate-bob" style="left:86%;top:12%;animation-delay:0.9s;animation-duration:7s"><b class="flame absolute -top-[15px] left-1/2 -ml-[4px] w-[8px] h-[15px] rounded-[50%_50%_50%_50%/60%_60%_40%_40%] bg-gradient-to-b from-white via-butter to-gold animate-flicker"></b></i><i class="candle absolute w-[11px] h-[34px] rounded-[3px] bg-gradient-to-b from-white to-[#efe4c6] animate-bob" style="left:15%;top:88%;animation-delay:1.6s;animation-duration:6s"><b class="flame absolute -top-[15px] left-1/2 -ml-[4px] w-[8px] h-[15px] rounded-[50%_50%_50%_50%/60%_60%_40%_40%] bg-gradient-to-b from-white via-butter to-gold animate-flicker"></b></i><i class="candle absolute w-[11px] h-[34px] rounded-[3px] bg-gradient-to-b from-white to-[#efe4c6] animate-bob" style="left:80%;top:86%;animation-delay:0.3s;animation-duration:6.8s"><b class="flame absolute -top-[15px] left-1/2 -ml-[4px] w-[8px] h-[15px] rounded-[50%_50%_50%_50%/60%_60%_40%_40%] bg-gradient-to-b from-white via-butter to-gold animate-flicker"></b></i></div>
    <svg class="fleuron fleuron-top" aria-hidden="true"><use href="#fleuron"/></svg>
    <svg class="fleuron fleuron-bottom" aria-hidden="true"><use href="#fleuron"/></svg>

    <!-- Scene −1 — Gate: one tap = music can start -->
    <section class="scene" id="scene-gate" inert>
      <p class="latin blurin m-0 text-[clamp(1.7rem,7.5vw,2.3rem)] leading-tight text-dusk" id="gateTitle" style="--d:.2s"></p>
      <button class="gate-seal blurin" id="gateEnter" type="button" aria-label="باز کردن دعوت‌نامه با موسیقی" data-nosound style="--d:.9s">✦</button>
    </section>

    <!-- Scene 0 — Opening -->
    <section class="scene" id="scene-opening" inert>
      <p class="open-line latin blurin" id="openLine" style="--d:.3s"></p>
      <svg class="divider blurin" aria-hidden="true" style="--d:1.4s"><use href="#fleuron"/></svg>
      <p class="open-sub blurin" id="openSub" style="--d:2s"></p>
      <p class="open-guest blurin" id="openGuest" style="--d:3.2s"></p>
      <p class="open-hint blurin" id="openHint" style="--d:4.2s"></p>
    </section>

    <!-- Scene 1 — The Question -->
    <section class="scene" id="scene-question" inert>
      <p class="guest-line reveal" id="questionGuest" style="--d:.1s"></p>
      <h1 class="title reveal" id="questionTitle" style="--d:.3s"></h1>
      <p class="taunt reveal" id="taunt" aria-live="polite" style="--d:.7s"></p>
      <div class="arena" id="arena">
        <button class="btn btn-primary btn-yn" id="btnYes" type="button" data-nosound>YES</button>
        <button class="btn btn-ghost btn-yn" id="btnNo" type="button" data-nosound>NO</button>
      </div>
    </section>

    <!-- Scene 3 — Magical invitation -->
    <section class="scene" id="scene-letter" inert>
      <div class="letter-stage" id="letterStage">
        <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="باز کردن پاکت دعوت‌نامه">
          <div class="env-back"></div>
          <div class="paper" id="paper">
            <div class="paper-inner">
              <p class="p-line latin" id="letterNo" style="--d:.2s"></p>
              <svg class="divider p-line" aria-hidden="true" style="--d:.5s"><use href="#fleuron"/></svg>
              <p class="p-line p-selected latin" id="letterSelected" style="--d:.9s"></p>
              <p class="p-line p-name" id="letterName" style="--d:1.3s"></p>
              <p class="p-line p-mission" id="letterMission" style="--d:1.8s"></p>
            </div>
          </div>
          <div class="env-front"></div>
          <div class="env-flap"></div>
          <div class="seal" id="seal" aria-hidden="true">✦</div>
        </div>
      </div>
      <p class="hint" id="letterHint">پاکت را لمس کن</p>
      <button class="btn btn-primary later" id="letterNext" type="button" tabindex="-1">ادامه</button>
      <div class="egg absolute inset-0 z-20 grid place-items-center p-6 bg-dusk/40 backdrop-blur-[3px] opacity-0 invisible transition-opacity duration-500" id="egg" role="dialog" aria-modal="true" aria-labelledby="eggTitle" inert>
        <div class="egg-card w-full rounded-[10px] bg-gradient-to-b from-[#fffdf6] to-[#f3e9cf] px-5 py-7 text-center ring-1 ring-gold shadow-2xl">
          <p class="latin m-0 text-lg text-gold-deep" id="eggTitle"></p>
          <svg class="divider mx-auto block" aria-hidden="true"><use href="#fleuron"/></svg>
          <p class="m-0 mb-4 font-fa text-xl leading-loose text-ink whitespace-pre-line" id="eggText"></p>
          <button class="btn btn-ghost btn-sm" id="eggClose" type="button">بستن</button>
        </div>
      </div>
    </section>

    <!-- Scene 4 — Secret access -->
    <section class="scene" id="scene-secret" inert>
      <p class="kicker latin reveal m-0 mb-1 text-xl text-gold-deep" style="--d:.1s">Secret access</p>
      <h2 class="title title-sm reveal" style="--d:.25s">رمز ورود</h2>
      <p class="lede reveal my-1 mb-4 font-fa text-[1.3rem] leading-[1.9] text-ink" id="secretHint" style="--d:.5s"></p>
      <form class="secret-form reveal" id="secretForm" autocomplete="off" novalidate style="--d:.7s">
        <div class="field" id="field">
          <input id="codeInput" type="text" enterkeyhint="go" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="32" placeholder="رمز را وارد کن" aria-label="رمز ورود">
        </div>
        <p class="msg" id="secretMsg" aria-live="polite"></p>
        <button class="btn btn-primary" id="secretBtn" type="submit">ورود</button>
      </form>
    </section>

    <!-- Scene 5 — Memory hunt -->
    <section class="scene scene-map" id="scene-map" inert>
      <h2 class="title title-sm reveal" style="--d:.1s">نقشهٔ خاطره‌ها</h2>
      <p class="map-counter reveal" id="mapCounter" style="--d:.3s"></p>
      <div class="map reveal" id="map" style="--d:.5s">
        <svg class="map-art" viewBox="0 0 300 375" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <linearGradient id="mapSky" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#cfdff3"/>
              <stop offset=".22" stop-color="#eef3fa"/>
              <stop offset=".3" stop-color="#e9efdf"/>
              <stop offset="1" stop-color="#d6e3cf"/>
            </linearGradient>
          </defs>
          <rect width="300" height="375" fill="url(#mapSky)"/>
          <!-- château -->
          <g>
            <rect x="92" y="54" width="116" height="32" fill="#f1e8d1"/>
            <rect x="70" y="62" width="26" height="24" fill="#ebe1c8"/>
            <rect x="204" y="62" width="26" height="24" fill="#ebe1c8"/>
            <polygon points="88,54 104,38 196,38 212,54" fill="#7f9bd0"/>
            <polygon points="66,62 76,50 90,50 100,62" fill="#7f9bd0"/>
            <polygon points="200,62 210,50 224,50 234,62" fill="#7f9bd0"/>
            <g fill="#c6a15b" opacity=".8">
              <rect x="102" y="60" width="4" height="9"/><rect x="116" y="60" width="4" height="9"/><rect x="130" y="60" width="4" height="9"/>
              <rect x="144" y="60" width="4" height="9"/><rect x="158" y="60" width="4" height="9"/><rect x="172" y="60" width="4" height="9"/><rect x="186" y="60" width="4" height="9"/>
            </g>
          </g>
          <!-- hedges & parterre -->
          <g fill="#c9dabf">
            <rect x="20" y="104" width="86" height="14" rx="7"/><rect x="194" y="104" width="86" height="14" rx="7"/>
            <rect x="14" y="196" width="60" height="12" rx="6"/><rect x="226" y="196" width="60" height="12" rx="6"/>
            <rect x="28" y="300" width="70" height="12" rx="6"/><rect x="200" y="322" width="70" height="12" rx="6"/>
          </g>
          <g fill="none" stroke="#b7c9ee" stroke-width="1.2">
            <ellipse cx="150" cy="200" rx="46" ry="30"/><ellipse cx="150" cy="200" rx="30" ry="18"/>
          </g>
          <circle cx="150" cy="200" r="11" fill="#cfdff3" stroke="#c6a15b" stroke-width="1.2"/>
          <circle cx="150" cy="200" r="4" fill="#fbf7ec"/>
          <!-- cypress -->
          <g fill="#a7bc9f">
            <path d="M40 158c-6-20-6-38 0-52 6 14 6 32 0 52z"/><path d="M262 158c-6-20-6-38 0-52 6 14 6 32 0 52z"/>
            <path d="M30 262c-5-16-5-32 0-44 5 12 5 28 0 44z"/><path d="M272 270c-5-16-5-32 0-44 5 12 5 28 0 44z"/>
          </g>
          <!-- blossoms -->
          <g>
            <circle cx="22" cy="340" r="5" fill="#f2dc8a"/><circle cx="34" cy="350" r="4" fill="#fff"/><circle cx="14" cy="352" r="4" fill="#a9bfe3"/>
            <circle cx="278" cy="352" r="5" fill="#a9bfe3"/><circle cx="266" cy="360" r="4" fill="#fff"/><circle cx="286" cy="340" r="4" fill="#f2dc8a"/>
          </g>
          <!-- golden path -->
          <path d="M150 372C90 345 58 302 72 277S200 255 216 232 90 200 102 165 230 140 228 112 170 85 150 64" fill="none" stroke="#c6a15b" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 7" vector-effect="non-scaling-stroke"/>
        </svg>
        <div class="steps absolute inset-0 pointer-events-none" id="steps"></div>
        <div class="pins" id="pins"></div>
      </div>
      <button class="btn btn-primary later" id="mapNext" type="button" tabindex="-1">ادامه</button>

      <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" inert>
        <div class="modal-card">
          <p class="modal-label latin" id="modalLabel"></p>
          <h3 class="modal-title" id="modalTitle"></h3>
          <img class="modal-img" id="modalImg" alt="" loading="lazy" decoding="async" hidden>
          <p class="modal-text" id="modalText"></p>
          <button class="btn btn-ghost btn-sm" id="modalSound" type="button" hidden>▶ پیام صوتی</button>
          <div class="ask mt-5 border-t border-dashed border-gold/70 pt-4 text-center" id="ask" hidden>
            <p class="m-0 mb-3 font-fa text-lg leading-loose text-gold-deep" id="askPrompt"></p>
            <div id="askControls">
              <input class="mb-3 w-full rounded-xl border-0 bg-[#fffdf6] p-3 text-center font-fa text-base text-ink ring-1 ring-gold focus:outline-none focus:ring-2 focus:ring-hydrangea" id="askName" type="text" maxlength="40" autocomplete="name" placeholder="اسمت چیه؟" aria-label="اسم" hidden>
              <textarea class="mb-3 w-full resize-none rounded-xl border-0 bg-[#fffdf6] p-3 font-fa text-base leading-relaxed text-ink ring-1 ring-gold focus:outline-none focus:ring-2 focus:ring-hydrangea" id="askText" rows="2" maxlength="400" placeholder="چند خط بنویس (اختیاری)" aria-label="متن"></textarea>
              <div class="flex flex-wrap items-center justify-center gap-2" id="askBtns">
                <label class="btn btn-ghost btn-sm !mt-0 inline-flex cursor-pointer items-center justify-center" id="askPhotoLabel" for="askPhoto">📷 عکس</label>
                <input class="sr-only" type="file" id="askPhoto" accept="image/*">
                <button class="btn btn-ghost btn-sm !mt-0" id="askRec" type="button">🎙 ضبط ویس</button>
              </div>
              <div class="mt-3 flex flex-col items-center gap-2" id="askPreview"></div>
            </div>
            <button class="btn btn-primary btn-sm" id="askSend" type="button" disabled>ذخیره برای من</button>
            <button class="btn btn-ghost btn-sm" id="askEdit" type="button" hidden>تغییر</button>
            <p class="ask-status mt-2 mb-0 min-h-[1.6em] font-fa text-base" id="askStatus" aria-live="polite"></p>
            <p class="m-0 mt-1 font-ui text-xs text-ink/60" id="askNote"></p>
          </div>
          <button class="btn btn-ghost btn-sm" id="modalClose" type="button">بستن</button>
        </div>
      </div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </section>

    <!-- Scene 6 — Countdown -->
    <section class="scene" id="scene-countdown" inert>
      <p class="kicker latin reveal" style="--d:.1s">The night begins in…</p>
      <h2 class="title title-sm reveal" style="--d:.25s">شب آغاز می‌شود در…</h2>
      <div class="clock reveal" id="clock" style="--d:.5s">
        <div class="cell"><span class="num" id="cdSeconds">۰۰</span><span class="lbl">ثانیه<small class="latin">seconds</small></span></div>
        <div class="cell"><span class="num" id="cdMinutes">۰۰</span><span class="lbl">دقیقه<small class="latin">minutes</small></span></div>
        <div class="cell"><span class="num" id="cdHours">۰۰</span><span class="lbl">ساعت<small class="latin">hours</small></span></div>
        <div class="cell"><span class="num" id="cdDays">۰۰</span><span class="lbl">روز<small class="latin">days</small></span></div>
      </div>
      <p class="lede my-1 mb-4 font-fa text-[1.3rem] leading-[1.9] text-gold-deep" id="cdMessage" aria-live="polite"></p>
      <button class="btn btn-primary" id="cdNext" type="button">ادامه</button>
    </section>

    <!-- Scene 7 — Party info -->
    <section class="scene" id="scene-info" inert>
      <p class="kicker latin reveal" style="--d:.1s">The invitation</p>
      <h2 class="title title-sm reveal" id="infoTitle" style="--d:.25s"></h2>
            <h3 class=" title-xs reveal" id="1" style="--d:.25s"> اسکرین بگیر خوشگله</h3>
      <svg class="divider reveal" aria-hidden="true" style="--d:.4s"><use href="#fleuron"/></svg>
      <ul class="info reveal m-0 mb-4 w-full max-w-[340px] list-none p-0 text-start" id="infoList" style="--d:.55s"></ul>
      <a class="btn btn-ghost btn-sm" id="infoMap" href="#" target="_blank" rel="noopener" hidden>مسیریابی</a>
      <button class="btn btn-primary" id="infoNext" type="button">آماده‌ام</button>
    </section>
  </main>

  <!-- ============ FINAL REVEAL ============ -->
  <div class="blackout" id="blackout" aria-live="polite"><p class="black-text latin" id="blackText"></p></div>
  <div class="light" id="light" aria-hidden="true"></div>

  <section class="finale" id="finale" aria-label="تولدت مبارک">
    <div class="balloons" id="balloons" aria-hidden="true"></div>
    <div class="finale-stage">
      <div class="finale-text">
        <p class="f-guest" id="fGuest"></p>
        <h1 class="f-title latin"><span>IT'S MY</span><span>BIRTHDAY</span></h1>
        <p class="f-name" id="fName"></p>
        <p class="f-line" id="fLine"></p>
        <div class="f-actions">
          <a class="f-btn" id="fRsvp" href="#" target="_blank" rel="noopener" hidden>تأیید حضور</a>
          <button class="f-btn f-btn-quiet" id="fReplay" type="button">دوباره از اول</button>
        </div>
      </div>
    </div>
  </section>

  <canvas id="fx" aria-hidden="true"></canvas>

  <!-- Hidden form so Netlify can detect the "memories" form at deploy time (guest uploads) -->
  <form name="memories" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input name="bot-field"><input name="guest">
    <input name="q1"><textarea name="text1"></textarea><input type="file" name="photo1"><input type="file" name="voice1">
    <input name="q2"><textarea name="text2"></textarea><input type="file" name="photo2"><input type="file" name="voice2">
    <input name="q3"><textarea name="text3"></textarea><input type="file" name="photo3"><input type="file" name="voice3">
    <input name="q4"><textarea name="text4"></textarea><input type="file" name="photo4"><input type="file" name="voice4">
    <input name="q5"><textarea name="text5"></textarea><input type="file" name="photo5"><input type="file" name="voice5">
    <input name="q6"><textarea name="text6"></textarea><input type="file" name="photo6"><input type="file" name="voice6">
  </form>

  <script src="script.js"></script>
</body>
</html>
